name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medchron
          POSTGRES_PASSWORD: medchron
          POSTGRES_DB: medchron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medchron"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEDCHRON_TEST_DATABASE_URL: postgresql+psycopg://medchron:medchron@localhost:5432/medchron_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test
        run: make test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
