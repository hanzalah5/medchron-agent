name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medchron
          POSTGRES_PASSWORD: medchron
          POSTGRES_DB: medchron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medchron"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Migrations and owner-only checks use the owner. The API and worker tests connect as
      # the non-owner roles created below, so row-level security is enforced for real.
      MEDCHRON_TEST_DATABASE_URL: postgresql+psycopg://medchron:medchron@localhost:5432/medchron_test
      MEDCHRON_TEST_APP_DATABASE_URL: postgresql+psycopg://medchron_api:medchron_api@localhost:5432/medchron_test
      MEDCHRON_TEST_WORKER_DATABASE_URL: postgresql+psycopg://medchron_worker:medchron_worker@localhost:5432/medchron_test
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Create the non-owner database roles
        run: DATABASE_URL="$MEDCHRON_TEST_DATABASE_URL" .venv/bin/medchron db-users
      - name: Test
        run: make test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medchron
          POSTGRES_PASSWORD: medchron
          POSTGRES_DB: medchron_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medchron"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://medchron:medchron@localhost:5432/medchron_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install backend
        run: make install
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI (type-check + bundle)
        working-directory: ui
        run: npm ci && npm run build
      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (upload -> pipeline -> click-to-source -> review)
        working-directory: ui
        run: npm run e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t medchron:ci .
      - name: Smoke test image (healthz, CLI, OCR binary)
        run: |
          docker run --rm medchron:ci medchron --version
          docker run --rm medchron:ci tesseract --version | head -1
          docker run -d --name api -p 8080:8080 -e MEDCHRON_ENV=test medchron:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q "MedChron Reviewer"
          docker rm -f api
      - name: Vulnerability scan (fail on fixable critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0 # older release assets have been removed upstream
          image-ref: medchron:ci
          # Vulnerabilities only. Repository secrets are covered by gitleaks above; the image's
          # secret scan flags example credentials in third-party SDK docstrings (false positives).
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform fmt -check -diff -recursive infra/terraform
      - name: Validate environments
        run: |
          for env in dev prod-demo; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
