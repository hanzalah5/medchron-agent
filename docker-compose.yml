# Local development stack. API, worker and UI services are added in later steps.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medchron
      POSTGRES_PASSWORD: medchron  # local development only
      POSTGRES_DB: medchron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medchron"]
      interval: 5s
      retries: 10

  # Full stack: docker compose --profile app up --build
  migrate:
    profiles: ["app"]
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://medchron:medchron@db:5432/medchron
      MEDCHRON_ENV: development
      MEDCHRON_AUTH_MODE: dev
      MEDCHRON_STORAGE: /data/storage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [storage:/data/storage]
    depends_on:
      db: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: .
    environment: *app-env
    ports: ["8080:8080"]
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: ["app"]
    build: .
    command: ["medchron", "worker"]
    environment: *app-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  storage:
