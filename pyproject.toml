[project]
name = "medchron"
version = "1.0.0"
description = "Reference implementation: grounded multi-agent medical record review and chronology for legal-healthcare work (synthetic data only)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "reportlab>=4.2",
    "pillow>=10.4",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "anthropic>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "numpy>=1.26",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mcp>=2.3",
]

mcp = [
    "mcp>=2.3",
]
gcp = [
    "google-cloud-storage>=2.18",
]
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
medchron = "medchron.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medchron"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["medchron"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["reportlab.*", "pytesseract.*", "pymupdf.*", "pgvector.*", "sentence_transformers.*",
          "docx.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["medchron.ingestion.pdf", "medchron.api.app"]  # PyMuPDF is partially annotated
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
